<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- hive hexagon -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#f59e0b"/>
  <polygon points="32,8 53.5,20.5 53.5,43.5 32,56 10.5,43.5 10.5,20.5" fill="#1d160b"/>
  <polygon points="32,13 49,23 49,41 32,51 15,41 15,23" fill="#fbbf24"/>
  <!-- bee stripes -->
  <g clip-path="url(#hexclip)">
    <rect x="15" y="28" width="34" height="5" fill="#1d160b" opacity="0.92"/>
    <rect x="15" y="37" width="34" height="5" fill="#1d160b" opacity="0.92"/>
  </g>
  <!-- bee body -->
  <ellipse cx="32" cy="31" rx="7" ry="9" fill="#1d160b"/>
  <ellipse cx="32" cy="31" rx="7" ry="9" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.5"/>
  <!-- wings -->
  <ellipse cx="25" cy="20" rx="6" ry="8" fill="#fef3c7" opacity="0.9" transform="rotate(-25 25 20)"/>
  <ellipse cx="39" cy="20" rx="6" ry="8" fill="#fef3c7" opacity="0.9" transform="rotate(25 39 20)"/>
  <defs>
    <clipPath id="hexclip">
      <polygon points="32,13 49,23 49,41 32,51 15,41 15,23"/>
    </clipPath>
  </defs>
</svg>
